; Kiln chain-load list (docs/kiln/launcher/contracts.md). The proxy loads these DLLs in its DllMain, in order:
; [chain], then <game>\dinput8-chain.ini (EMF), then [profile]. Relative paths are relative to <game>\kiln\.
; An entry whose path [late] repeats is not loaded by the proxy: kiln-core loads it after Kiln and ShroudForge started.
[chain]
; proxies the installer moved aside (kiln_manage::install); a leading ; switches one off
chain\emf-dinput8.dll

[profile]
; native mods with phase "dllmain" of the active profile (kiln_manage::profile::activate)
Z:\home\user\.local\share\kiln\library\native\fps-unlock\2.0.0+00000000\fpsunlock.dll

[late]
; DLLs of the lists above that the core loads after Kiln's services and plugins, so their hooks chain after Kiln's.
; Put the same path here as in its own list. Limits: EMF's own loader is never deferred (it starts EMF itself);
; a DLL another loader already started (EMF's loader starts the DLLs of dinput8-chain.ini itself) is not moved; a
; native mod's DLL loads only when the mod does.
