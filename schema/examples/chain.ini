; Kiln chain-load list (docs/kiln/launcher/contracts.md). The proxy loads these DLLs in its DllMain, in order:
; [chain], then <game>\dinput8-chain.ini (EMF), then [profile]. Relative paths are relative to <game>\kiln\.
[chain]
; proxies the installer moved aside (kiln_manage::install); a leading ; switches one off
chain\emf-dinput8.dll

[profile]
; native mods with phase "dllmain" of the active profile (kiln_manage::profile::activate)
Z:\home\user\.local\share\kiln\library\native\fps-unlock\2.0.0+00000000\fpsunlock.dll
