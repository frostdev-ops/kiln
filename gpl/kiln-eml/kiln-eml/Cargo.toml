# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "kiln-eml"
# kiln-eml's own version; the EML it carries is eml/* (0.2.0)
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors = ["Brabb3l (EML)", "Kiln contributors (kiln-eml)"]
description = "EML (Enshrouded Mod Loader) as a Kiln plugin"
publish = false

[lib]
name = "kiln_eml"
# cdylib: kiln-eml.dll (build.sh renames kiln_eml.dll); rlib: kiln-eml-run and the tests
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kiln-eml-run"
path = "src/kiln_eml_run.rs"

[[bin]]
name = "kiln-eml-inspect"
path = "src/kiln_eml_inspect.rs"

[[bin]]
name = "kiln-portraits"
path = "src/kiln_portraits.rs"

[dependencies]
mod-loader.workspace = true
kfc.workspace = true
half.workspace = true
png = "0.17.16"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# kiln_mode: the launch plan is used only when its SHA-256 is kiln.launch's (already in the graph via mod-loader-lua)
sha2 = "0.10"
camino.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip = "4.2.0"
# The SF-dialect startup pass (the type session on): the shared Lua/core layer (MIT) under the GPL session. Its serde_json
# preserve_order reaches this whole graph; JSON this plugin writes sorts its keys explicitly (ownership.rs).
mlua.workspace = true
sfi-core = { path = "../../../crates/sfi/sfi-core" }
# (the frozen launch plan read by the interpreter's own reader, MIT, serde_json + sha2 only)
sfi-policy = { path = "../../../crates/sfi/sfi-policy" }
# kiln.eml.archive v1: the provider table is the generated binding of the MIT header
# native/core/abi/services/kiln_eml_archive.h (no_std, no dependencies), so its layout is the header's.
kiln-abi = { path = "../../../crates/sfi/kiln-abi" }
# The archive service's registry digest; already in this graph through mod-loader-lua.

# (the test lock/spawn gate)
[dev-dependencies]
# Test-only: the test lock/spawn gate (eml/mod-loader-lua/src/test_gate.rs) for this crate's unit tests, around
# mod-loader-lua's file locks and this crate's own. Dev-dependencies never reach a normal build, so the shipped
# kiln-eml.dll has no gate (`cargo tree -e no-dev,features -p kiln-eml` lists no test-gate).
mod-loader-lua = { path = "../eml/mod-loader-lua", features = ["test-gate"] }

# Test-only, Windows: finds MSVC's cl.exe to build the C consumers of tests/c (tests/support/c_consumer); already in
# this graph as lua-src's build dependency.
[target.'cfg(windows)'.dev-dependencies]
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
