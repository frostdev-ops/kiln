# SPDX-License-Identifier: GPL-3.0-or-later
# kiln-eml: EML (Enshrouded Mod Loader, Brabb3l/kfc-parser v0.2.0) as a Kiln plugin. GPL-3.0-or-later, like EML.
# This directory is its own Cargo workspace on purpose: it is not part of Kiln's MIT workspace (../../Cargo.toml) and
# nothing in Kiln's MIT tree depends on it. See README.md and ../../docs/kiln/eml.md.
#   eml/*      EML's crates as published at v0.2.0 (changes marked "kiln-eml:", listed in README.md)
#   kiln-eml   the plugin (kiln-eml.dll, Windows cdylib) + kiln-eml-run (host runner for tests and offline checks)
[workspace]
resolver = "3"
members = [
    "eml/kfc",
    "eml/kfc-base",
    "eml/kfc-content",
    "eml/kfc-resource",
    "eml/mod-loader",
    "eml/mod-loader-base",
    "eml/mod-loader-lua",
    "eml/mod-loader-runtime",
    "kiln-eml",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
authors = ["Brabb3l"]
license = "GPL-3.0-or-later"
license-file = "LICENSE"
rust-version = "1.89.0"

[workspace.dependencies]
kfc = { path = "eml/kfc", features = ["resource", "content"] }
mod-loader = { path = "eml/mod-loader", features = ["lua", "runtime"] }

anyhow = { version = "1.0.95", features = ["backtrace"] }
thiserror = "2.0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = { version = "2.8.0", features = ["serde"] }
parking_lot = "0.12.3"
walkdir = "2.5.0"
indexmap = { version = "2.9.0", features = ["serde"] }
uuid = { version = "1.18.0", features = ["v4"] }
crc = "3.3.0"
camino = "1.1.11"
semver = { version = "1.0", features = ["serde"] }

# processing
half = "2.6.0"
image = "0.25.6"

# logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"

[profile.release]
# kiln-eml: EML ships panic = "abort" (a panic shows a message box and ends the game). Kiln fails soft: a panic in a
# mod run is caught, logged and the game starts with vanilla data, so unwinding stays on.
panic = "unwind"
strip = true
