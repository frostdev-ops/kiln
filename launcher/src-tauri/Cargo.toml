[package]
name = "kiln-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kiln Launcher: play, configure and administer Enshrouded with Kiln (Tauri 2 backend)"

[lib]
name = "kiln_launcher_lib"
crate-type = ["rlib"]

[[bin]]
name = "kiln-launcher"
path = "src/main.rs"

[features]
# QA builds only: the KILN_DEV_EVAL_DIR hook (always on in debug builds). Never in shipped bundles.
dev-eval = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kiln-manage = { path = "../../crates/kiln-manage", features = ["full"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
