[package]
name = "kiln-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kiln Launcher: play, configure and administer Enshrouded with Kiln (Tauri 2 backend)"

[lib]
name = "kiln_launcher_lib"
crate-type = ["rlib"]

[[bin]]
name = "kiln-launcher"
path = "src/main.rs"

[features]
default = ["self-update"]
# The launcher's self-update (src/selfupdate: tauri-plugin-updater, the frostdev.io and GitHub Releases feeds). On in
# the direct builds (frostdev.io, GitHub); off in the Nexus Mods build (--no-default-features, with
# tauri.nexus.conf.json), because Nexus Mods does not allow programs that update themselves. The feature is the
# distribution: on = "direct", off = "nexus" (src/distribution.rs, docs/kiln/launcher/releasing.md).
self-update = ["dep:tauri-plugin-updater"]
# QA builds only: the KILN_DEV_EVAL_DIR hook (always on in debug builds). Never in shipped bundles.
dev-eval = []
# Update tests only: KILN_UPDATE_FEEDS may point the self-update at loopback feeds (always on in debug builds). Never in
# shipped bundles.
update-test-feeds = ["self-update"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kiln-manage = { path = "../../crates/kiln-manage", features = ["full"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
# Self-update (src/selfupdate, feature self-update): signed (minisign) updates of the AppImage and the NSIS install
tauri-plugin-updater = { version = "2.14", optional = true, default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deck UI (src/deck/browse.rs): a zip's file list before the library unpacks it (the same zip kiln-manage builds)
zip = { version = "9", default-features = false }

# Deck UI (src/deck/gamepad.rs): the native gamepad reader (pure Rust evdev; no libudev)
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[dev-dependencies]
# selfupdate tests drive the real updater plugin on a mock app
tauri = { version = "2.12", features = ["test"] }
