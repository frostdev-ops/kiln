[package]
name = "kiln-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kiln Launcher: play, configure and administer Enshrouded with Kiln (Tauri 2 backend)"

[lib]
name = "kiln_launcher_lib"
crate-type = ["rlib"]

[[bin]]
name = "kiln-launcher"
path = "src/main.rs"

[features]
# QA builds only: the KILN_DEV_EVAL_DIR hook (always on in debug builds). Never in shipped bundles.
dev-eval = []
# Update tests only: KILN_UPDATE_FEEDS may point the self-update at loopback feeds (always on in debug builds). Never in
# shipped bundles.
update-test-feeds = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kiln-manage = { path = "../../crates/kiln-manage", features = ["full"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
# Self-update (src/selfupdate): signed (minisign) updates of the AppImage and the NSIS install
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# selfupdate tests drive the real updater plugin on a mock app
tauri = { version = "2.12", features = ["test"] }
